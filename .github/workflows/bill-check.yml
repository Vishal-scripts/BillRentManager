# Manual only. A schedule is intentionally not enabled.
# On 10 Oct 2026 this site returned HTTP 406 from cloud IPs (AppTrana).
# GitHub-hosted runners are the same kind of network. Use the Windows PC script.
name: bill-check-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Tata Power-DDL once
        run: |
          python -m pip install -r billcheck/requirements.txt
          python billcheck/check_bills.py --probe
